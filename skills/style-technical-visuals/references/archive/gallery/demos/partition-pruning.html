<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Partition pruning</title>
<style>
  /* tokens: --panel #1c1c1c, --accent #f35815 (touched), --warn #d19f03 (sweep) */
  * { box-sizing: border-box; }
  body { margin:0; padding:24px 20px 28px; background:#111;
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color:#fafafa; overflow:hidden; }
  main { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; margin:0 0 4px; opacity:.9; }
  .sub { font-size: 12px; color: rgba(250,250,250,.6); margin: 0 0 14px; }
  .table { border: 1px solid rgba(255,255,255,.14); border-radius: 4px;
    background: #1c1c1c; padding: 16px; }
  .parts { display: grid; grid-template-columns: repeat(12, 1fr); gap: 5px;
    position: relative; }
  .part { aspect-ratio: 1.1; border: 1px solid rgba(255,255,255,.16);
    border-radius: 2px; display: flex; flex-direction: column; align-items: center;
    justify-content: center; font-size: 9px; font-variant-numeric: tabular-nums;
    color: rgba(250,250,250,.75);
    transition: background .25s, border-color .25s, opacity .25s; opacity: .5; }
  .part .yr { font-size: 7px; color: rgba(250,250,250,.4); letter-spacing: .06em; }
  .part.hit { background: #f35815; border-color: transparent; color: #fff; opacity: 1; }
  .part.hit .yr { color: rgba(255,255,255,.7); }
  .sweep { position: absolute; top: 0; bottom: 0; width: 34px;
    background: rgba(243,88,21,.25); border-radius: 2px; pointer-events: none;
    opacity: 0; }
  .controls { display: flex; gap: 16px; align-items: center; margin: 14px 0 0; flex-wrap: wrap; }
  label { font-size: 11px; color: rgba(250,250,250,.6); }
  select, button { font: 12px ui-monospace, Menlo, monospace; padding: 5px 10px;
    border: 1px solid rgba(255,255,255,.25); border-radius: 3px; background: #1c1c1c;
    color: #fafafa; }
  button { cursor: pointer; }
  button:hover { border-color: #f35815; color: #f35815; }
  .stats { display: flex; gap: 20px; margin-top: 12px; font-size: 12px;
    font-variant-numeric: tabular-nums; color: rgba(250,250,250,.75); }
  .stats .bad { color: #ff455d; }
  .stats .good { color: #27b648; }
  .query { margin: 10px 0 0; font-size: 12px; color: rgba(250,250,250,.75); }
  .query b { color: #f35815; }
</style>
</head>
<body>
<main>
  <h1>Partition pruning</h1>
  <p class="sub">A 24-month orders table, partitioned by month (~50M rows/month).
  The optimizer lights only the partitions your WHERE range touches.</p>
  <div class="table"><div class="parts" id="parts"></div></div>
  <div class="controls">
    <label>from <select id="from"></select></label>
    <label>to <select id="to"></select></label>
    <button id="btn-sweep">Run query</button>
  </div>
  <p class="query" id="query"></p>
  <div class="stats" id="stats"></div>
</main>
<script>
  const MONTHS = 24; // 2025-01 .. 2026-12
  const ROWS_PER_MONTH = 50000000;
  const parts = document.getElementById("parts");
  const labels = [];
  for (let i = 0; i < MONTHS; i++) {
    const y = 2025 + Math.floor(i / 12), m = (i % 12) + 1;
    labels.push(y + "-" + String(m).padStart(2, "0"));
    const d = document.createElement("div");
    d.className = "part";
    d.innerHTML = "<span class='yr'>" + y + "</span><span>" + String(m).padStart(2, "0") + "</span>";
    d.title = "p" + y + "_" + m + " — ~50M rows";
    parts.appendChild(d);
  }
  const cells = [...parts.children];

  const fromSel = document.getElementById("from");
  const toSel = document.getElementById("to");
  labels.forEach(function (l, i) {
    fromSel.add(new Option(l, i));
    toSel.add(new Option(l, i));
  });
  fromSel.value = 0; toSel.value = 23;

  function paint() {
    const f = +fromSel.value, t = +toSel.value;
    cells.forEach(function (c, i) { c.classList.toggle("hit", i >= f && i <= t); });
    document.getElementById("query").innerHTML =
      "<code>SELECT SUM(total) FROM orders <b>WHERE created_at BETWEEN '" +
      labels[f] + "-01' AND '" + labels[t] + "-28'</b></code>";
    const touched = t - f + 1;
    const scanned = touched * ROWS_PER_MONTH;
    const full = MONTHS * ROWS_PER_MONTH;
    const pct = Math.round(scanned / full * 100);
    document.getElementById("stats").innerHTML =
      "<span>partitions touched <b>" + touched + "/" + MONTHS + "</b></span>" +
      "<span>rows scanned <b class='" + (pct > 50 ? "bad" : "good") + "'>" +
      (scanned / 1e9).toFixed(1) + "B of " + (full / 1e9).toFixed(1) + "B</b></span>" +
      "<span>pruned <b class='" + (pct < 50 ? "good" : "bad") + "'>" + (100 - pct) + "%</b></span>";
  }
  fromSel.onchange = toSel.onchange = paint;
  paint();

  // sweep animation: orange glow travels across the touched range
  const glow = document.createElement("div");
  glow.className = "sweep";
  parts.appendChild(glow);
  document.getElementById("btn-sweep").onclick = function () {
    const f = +fromSel.value, t = +toSel.value;
    const left = cells[f].offsetLeft;
    const right = cells[t].offsetLeft + cells[t].offsetWidth;
    glow.style.opacity = 1;
    glow.animate(
      [{ left: (left - 34) + "px", opacity: 0 },
       { opacity: 1, offset: 0.15 },
       { left: right + "px", opacity: 0 }],
      { duration: 600 + (t - f) * 40, easing: "ease-in-out" }
    );
  };

  // Report content height to the gallery frame (works across origins,
  // including file://). The gallery grows our iframe to match — never clips.
  const postH = () => { try { parent.postMessage({ demoHeight: Math.ceil(document.body.scrollHeight) }, "*"); } catch (e) {} };
  window.addEventListener("load", postH);
  window.addEventListener("resize", postH);
  new MutationObserver(postH).observe(document.body, { childList: true, subtree: true, characterData: true });
  postH();
</script>
</body>
</html>
