<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Queue · Worker pool</title>
<!-- Original standalone reference. Copy the slotted queue and server panels
     for asynchronous job processing. Offline; no external assets or scripts.
     Arrows show job flow, not which side initiates a network request. -->
<style>
:root {
  color-scheme: dark;
  --canvas: #111111; --panel: #1c1c1c;
  --border: rgba(255,255,255,.14); --border-node: rgba(255,255,255,.22);
  --track: rgba(255,255,255,.10);
  --text: #fafafa; --text-muted: rgba(250,250,250,.60);
  --text-dim: rgba(250,250,250,.40);
  --accent: #f35815; --good: #27b648; --warn: #d19f03;
  --bad: #ff455d; --info: #1e9de7;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--canvas); color: var(--text);
  font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
main { max-width: 860px; margin: auto; padding: 56px 28px 32px; }
.eyebrow { color: var(--text-muted); font-size: 11px; letter-spacing: .12em; }
h1 { margin: 12px 0; font-size: clamp(22px, 4vw, 30px); font-weight: 500; letter-spacing: -.04em; }
header p { color: var(--text-muted); max-width: 62ch; margin: 0; }
figure { margin: 32px 0 0; }
svg { display: block; width: 100%; height: auto; font: inherit; }
.node { fill: var(--panel); stroke: var(--border-node); stroke-width: 1.5; }
.queue { stroke: var(--accent); }
.wire { fill: none; stroke: var(--info); stroke-width: 1.5; }
.label { fill: var(--text); font-size: 19px; }
.meta { fill: var(--text-muted); font-size: 13px; }
.role { fill: var(--accent); font-size: 12px; letter-spacing: 1px; }
.caption { fill: var(--info); font-size: 12px; }
figcaption { border-top: 1px solid var(--border); padding-top: 18px;
  color: var(--text-muted); max-width: 100%; }
figcaption strong { color: var(--text); font-weight: 500; }
footer { margin-top: 24px; color: var(--text-muted); font-size: 11px; }
@media (max-width: 540px) { main { padding: 28px 16px; } }
</style>
</head>
<body>
<main>
<header>
<div class="eyebrow">ASYNC PROCESSING / 03</div>
<h1>One queue. Three workers.</h1>
<p>Producers enqueue jobs. A shared queue buffers pending work while three workers take jobs and process them concurrently.</p>
</header>
<figure>
<svg viewBox="0 0 800 550" role="img" aria-labelledby="queue-title queue-description">
<title id="queue-title">Shared job queue with three workers</title>
<desc id="queue-description">Producers send jobs to a queue containing five pending jobs. Three paths lead from the queue to worker 01, worker 02, and worker 03. Workers compete for jobs; jobs are not broadcast to every worker.</desc>
<defs>
<marker id="job-arrow" viewBox="0 -4 8 8" refX="8" refY="0" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
<path d="M0 -3 L8 0 L0 3" fill="none" stroke="var(--info)" stroke-width="1.3"/>
</marker>
<g id="worker-panel">
<rect width="200" height="140" rx="4"/>
<path d="M0 28 H200 M16 14 H36 M44 14 H64" fill="none"/>
</g>
</defs>
<!-- Exact face-center ports: producer bottom (400,70), queue top
     (400,150), queue bottom (400,260), worker tops (140/400/660,380). -->
<path class="wire" d="M400 70 V150" marker-end="url(#job-arrow)"/>
<text class="caption" x="418" y="115">enqueue</text>
<path class="wire" d="M400 260 V320"/>
<path class="wire" d="M400 320 H140 V380" marker-end="url(#job-arrow)"/>
<path class="wire" d="M400 320 V380" marker-end="url(#job-arrow)"/>
<path class="wire" d="M400 320 H660 V380" marker-end="url(#job-arrow)"/>
<circle cx="400" cy="320" r="3" fill="var(--info)"/>
<text class="caption" x="418" y="295">take a job</text>
<rect class="node" x="300" y="20" width="200" height="50" rx="4"/>
<text class="label" x="400" y="51" text-anchor="middle">producers</text>
<rect class="node queue" x="200" y="150" width="400" height="110" rx="4"/>
<text class="role" x="220" y="176">JOB QUEUE</text>
<text class="meta" x="580" y="176" text-anchor="end">pending work</text>
<rect x="220" y="194" width="64" height="44" rx="2" fill="var(--track)" stroke="var(--border-node)"/>
<text class="meta" x="252" y="221" text-anchor="middle">job 1</text>
<rect x="292" y="194" width="64" height="44" rx="2" fill="var(--track)" stroke="var(--border-node)"/>
<text class="meta" x="324" y="221" text-anchor="middle">job 2</text>
<rect x="364" y="194" width="64" height="44" rx="2" fill="var(--track)" stroke="var(--border-node)"/>
<text class="meta" x="396" y="221" text-anchor="middle">job 3</text>
<rect x="436" y="194" width="64" height="44" rx="2" fill="var(--track)" stroke="var(--border-node)"/>
<text class="meta" x="468" y="221" text-anchor="middle">job 4</text>
<rect x="508" y="194" width="64" height="44" rx="2" fill="var(--track)" stroke="var(--border-node)"/>
<text class="meta" x="540" y="221" text-anchor="middle">job 5</text>
<g transform="translate(40 380)">
<use href="#worker-panel" class="node"/>
<text class="meta" x="100" y="62" text-anchor="middle">WORKER</text>
<text class="label" x="100" y="91" text-anchor="middle">worker 01</text>
<text class="meta" x="100" y="119" text-anchor="middle">processes jobs</text>
</g>
<g transform="translate(300 380)">
<use href="#worker-panel" class="node"/>
<text class="meta" x="100" y="62" text-anchor="middle">WORKER</text>
<text class="label" x="100" y="91" text-anchor="middle">worker 02</text>
<text class="meta" x="100" y="119" text-anchor="middle">processes jobs</text>
</g>
<g transform="translate(560 380)">
<use href="#worker-panel" class="node"/>
<text class="meta" x="100" y="62" text-anchor="middle">WORKER</text>
<text class="label" x="100" y="91" text-anchor="middle">worker 03</text>
<text class="meta" x="100" y="119" text-anchor="middle">processes jobs</text>
</g>
</svg>
<figcaption><strong>Shared backlog, parallel processing.</strong> Workers compete for jobs rather than each receiving every job. Retries can cause redelivery; ordering and delivery guarantees depend on the queue configuration.</figcaption>
</figure>
<footer>1 shared queue · 3 workers · arrows show job flow</footer>
</main>
</body>
</html>
