<svg xmlns="http://www.w3.org/2000/svg" width="640" height="390" viewBox="0 0 640 390" role="img" aria-labelledby="title"><title id="title">Client calls the API. The API checks the cache, reads the store on a miss, and returns 200 when found or 404 when absent.</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#595954" /></marker></defs><style>text{font:28px system-ui,sans-serif;fill:#202020}.wire{fill:none;stroke:#595954;stroke-width:2;marker-end:url(#arrow)}.both{marker-start:url(#arrow)}</style><rect width="640" height="390" fill="white" rx="12" /><rect x="20" y="130" width="125" height="60" rx="4" fill="#f2eafa" stroke="#6533a0" stroke-width="2" data-shape="client" /><text x="82.5" y="170" text-anchor="middle">Client</text><rect x="225" y="130" width="130" height="60" rx="8" fill="#f2eafa" stroke="#6533a0" stroke-width="2" data-shape="service" /><text x="290.0" y="170" text-anchor="middle">API</text><rect x="470" y="35" width="145" height="60" rx="4" fill="#e5f2fc" stroke="#075e98" stroke-width="2" data-shape="cache" /><text x="542.5" y="75" text-anchor="middle">Cache</text><path d="M470 217V253C470 273 615 273 615 253V217Z" fill="#e5f2fc" stroke="#075e98" stroke-width="2" data-shape="database" /><ellipse cx="542.5" cy="217" rx="72.5" ry="12" fill="#e5f2fc" stroke="#075e98" stroke-width="2" /><text x="542.5" y="250" text-anchor="middle">Store</text><path class="wire " d="M145 160H225" /><path class="wire both" d="M355 145H410V65H470" /><text x="390" y="25" text-anchor="middle">check</text><path class="wire both" d="M355 175H410V235H470" /><text x="530" y="310" text-anchor="middle">on miss</text><path class="wire " d="M290 190V245H210V310" /><path class="wire " d="M290 245H355V310" /><rect x="155" y="310" width="110" height="60" rx="30.0" fill="#e2f3ef" stroke="#187636" stroke-width="2" data-shape="outcome" /><text x="210.0" y="350" text-anchor="middle">200</text><rect x="300" y="310" width="110" height="60" rx="30.0" fill="#fbeaf2" stroke="#c12e46" stroke-width="2" data-shape="outcome" /><text x="355.0" y="350" text-anchor="middle">404</text><path d="M82.5 190.0v18m-25 0h50" fill="none" stroke="#6533a0" stroke-width="2" /><path d="M470.0 47.0H615.0M499.0 26.0V35.0M499.0 95.0V104.0M528.0 26.0V35.0M528.0 95.0V104.0M557.0 26.0V35.0M557.0 95.0V104.0M586.0 26.0V35.0M586.0 95.0V104.0" fill="none" stroke="#075e98" stroke-width="2" /></svg>